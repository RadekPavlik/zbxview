name: Gallery thumbnails

# When screenshots change, regenerate small thumbnails (assets/thumbs/) and
# commit them back. The gallery order lives in assets/screens.json, curated by
# hand - this workflow never rewrites it (it only checks it points at files).
on:
  push:
    branches: [main]
    paths:
      - 'assets/shot*'
      - 'assets/scr_*'
      - 'assets/screens.json'
      - 'tools/gen-gallery.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thumbs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Generate thumbnails
        run: bash tools/gen-gallery.sh
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/thumbs
          if git diff --cached --quiet; then
            echo "No gallery changes."
          else
            git commit -m "chore: regenerate gallery thumbnails [skip ci]"
            git push
          fi
